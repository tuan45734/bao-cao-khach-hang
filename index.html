<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bản đồ khách hàng - Mobiwork</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="toggle-sidebar-btn" id="toggleSidebarBtn">Ẩn/Hiện</button>
    
    <div class="customer-counter" id="customerCounter">
        📊 <span id="customerCount">0</span> khách hàng
    </div>
    
    <!-- CHÚ THÍCH MÀU SẮC -->
    <div class="color-legend-bar">
        <span style="color: #FFD700;">🟡 cả 2 tháng</span>
        <span style="color: #E53E3E; margin-left: 12px;">🔴 tháng đầu</span>
        <span style="color: #3B82F6; margin-left: 12px;">🔵 tháng sau</span>
    </div>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <h2>📍 Bộ lọc khách hàng</h2>
            
            <div id="filterSection">
                <div class="filter-group date-range-group">
                    <label>📅 Từ tháng:</label>
                    <div class="select-with-count">
                        <select id="fromMonthFilter">
                            <option value="">-- Không chọn --</option>
                            <option value="1-2026">Tháng 1/2026</option>
                            <option value="2-2026">Tháng 2/2026</option>
                            <option value="3-2026">Tháng 3/2026</option>
                            <option value="4-2026">Tháng 4/2026</option>
                        </select>
                        <span class="month-count" id="fromMonthCount"></span>
                    </div>
                </div>
                
                <div class="filter-group date-range-group">
                    <label>📅 Đến tháng:</label>
                    <div class="select-with-count">
                        <select id="toMonthFilter">
                            <option value="">-- Không chọn --</option>
                            <option value="1-2026">Tháng 1/2026</option>
                            <option value="2-2026">Tháng 2/2026</option>
                            <option value="3-2026">Tháng 3/2026</option>
                            <option value="4-2026">Tháng 4/2026</option>
                        </select>
                        <span class="month-count" id="toMonthCount"></span>
                    </div>
                </div>
                
                <div class="filter-group">
                    <label>📺 Kênh:</label>
                    <select id="channelFilter">
                        <option value="all">-- Tất cả kênh --</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>🏷️ Loại:</label>
                    <select id="typeFilter">
                        <option value="all">-- Tất cả loại --</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>🗺️ Khu vực:</label>
                    <select id="areaFilter">
                        <option value="all">-- Tất cả khu vực --</option>
                        <option value="KV1">KV1</option>
                        <option value="KV2">KV2</option>
                        <option value="KV3">KV3</option>
                        <option value="KV4">KV4</option>
                        <option value="KV5">KV5</option>
                        <option value="KV6">KV6</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>🏢 Nhà phân phối (NPP):</label>
                    <select id="nppFilter">
                        <option value="all">-- Chọn NPP --</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>👤 Nhân viên:</label>
                    <select id="employeeFilter">
                        <option value="all">-- Chọn nhân viên --</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>📦 Ngành hàng:</label>
                    <select id="categoryFilter">
                        <option value="all">-- Tất cả ngành hàng --</option>
                    </select>
                </div>
                
                <button id="resetBtn">🔄 Xóa bộ lọc</button>
            </div>
        </div>
        
        <div id="map"></div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="data/kh.js"></script>
    <script src="data/nh-all.js"></script>
    <script src="js/area-highlight.js"></script>
    <script src="js/filters/date-range-filter.js"></script>
    <script src="js/filters/channel-filter.js"></script>
    <script src="js/filters/area-filter.js"></script>
    <script src="js/filters/npp-filter.js"></script>
    <script src="js/filters/employee-filter.js"></script>
    <script src="js/filters/category-filter.js"></script>
    <script src="js/map-handler.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
